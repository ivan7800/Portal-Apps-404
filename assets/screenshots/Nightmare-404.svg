<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Nightmare 404</title>
  <desc id="desc">Paisaje nocturno de Black Hollow con un edificio abandonado, niebla y una luz roja.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#070812"/><stop offset="1" stop-color="#17101b"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#e33737" stop-opacity=".8"/><stop offset="1" stop-color="#e33737" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#sky)"/>
  <circle cx="930" cy="160" r="150" fill="url(#glow)" filter="url(#blur)"/>
  <path d="M0 510 Q220 440 430 515 T850 500 T1200 515 V675 H0Z" fill="#090a0e"/>
  <g fill="#111118" stroke="#5d2630" stroke-width="3">
    <path d="M330 520V250L465 145 600 250V520Z"/>
    <path d="M600 520V300L740 220 850 300V520Z"/>
  </g>
  <g fill="#d94242">
    <rect x="435" y="300" width="45" height="70" rx="2"/><rect x="535" y="300" width="45" height="70" rx="2"/>
    <rect x="675" y="335" width="42" height="62" rx="2"/>
  </g>
  <g opacity=".3" fill="#d6d8e8">
    <ellipse cx="350" cy="560" rx="420" ry="42"/><ellipse cx="850" cy="605" rx="500" ry="48"/>
  </g>
  <text x="70" y="112" fill="#f0e8e8" font-family="Georgia,serif" font-size="72" letter-spacing="8">NIGHTMARE 404</text>
  <text x="74" y="162" fill="#c4515c" font-family="Arial,sans-serif" font-size="26" letter-spacing="6">BLACK HOLLOW</text>
  <text x="74" y="610" fill="#aaa4ad" font-family="Arial,sans-serif" font-size="22">TERROR PSICOLÓGICO · INVESTIGACIÓN · SUPERVIVENCIA</text>
</svg>
