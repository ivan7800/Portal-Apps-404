<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Size Match 404</title>
  <desc id="desc">Ilustración abstracta educativa sobre medidas, comodidad y comunicación.</desc>
  <defs>
