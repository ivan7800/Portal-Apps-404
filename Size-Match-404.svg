      <stop stop-color="#17152b"/><stop offset="1" stop-color="#312044"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f29ac1"/><stop offset="1" stop-color="#8fd3ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <circle cx="1030" cy="110" r="210" fill="#f29ac1" opacity=".08"/>
  <circle cx="180" cy="610" r="250" fill="#8fd3ff" opacity=".07"/>
  <g transform="translate(110 115)">
